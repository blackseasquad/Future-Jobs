# TEMPORARY (removed before merge): full verification of this branch, results pushed to claude/verify-results.
name: tmp verify
on:
  push:
    branches: ['claude/quiz-forecast-simulator']
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Tests, typecheck, build
        continue-on-error: true
        run: |
          set +e
          { echo "== npm test"; npm test 2>&1 | grep -E "^not ok|# (pass|fail)|Error" ; echo "exit=${PIPESTATUS[0]}";
            echo "== typecheck"; npx tsc --noEmit 2>&1 | tail -40; echo "exit=${PIPESTATUS[0]}";
            echo "== build"; npx vite build 2>&1 | tail -8; echo "exit=${PIPESTATUS[0]}"; } > ci-log.txt
          cat ci-log.txt
      - uses: supabase/setup-cli@v1
        with: { version: latest }
      - name: Local Supabase + migration + production-like Cedefop rows
        run: |
          mkdir -p /tmp/sb && cd /tmp/sb && supabase init --force >/dev/null
          supabase start -x studio,imgproxy,edge-runtime,logflare,vector,realtime,storage-api,postgres-meta,supavisor
          supabase status -o env | sed 's/^/SB_/' >> "$GITHUB_ENV"
          cd -
          DB_URL=$(supabase status -o env --workdir /tmp/sb | grep '^DB_URL' | cut -d= -f2- | tr -d '"')
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/schema.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261023000000_market_data.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261025000000_quiz_reports.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -c "insert into occupation_forecasts (source_id,edition,geo,isco2,occupation_label,start_year,end_year,annual_growth_pct) values
            ('cedefop','2026','BG','94','Food preparation assistants',2023,2035,4.7),('cedefop','2026','BG','25','Information and communications technology professionals',2023,2035,4),
            ('cedefop','2026','BG','82','Assemblers',2023,2035,2.1),('cedefop','2026','BG','96','Refuse workers and other elementary workers',2023,2035,1.7),
            ('cedefop','2026','BG','33','Business and administration associate professionals',2023,2035,1.6),('cedefop','2026','BG','53','Personal care workers',2023,2035,1.6),
            ('cedefop','2026','BG','44','Other clerical support workers',2023,2035,1),('cedefop','2026','BG','21','Science and engineering professionals',2023,2035,0.9),
            ('cedefop','2026','BG','42','Customer services clerks',2023,2035,0.9),('cedefop','2026','BG','91','Cleaners and helpers',2023,2035,0.9);"
          psql "$DB_URL" -c "notify pgrst, 'reload schema';"
      - name: Integration (real sources)
        continue-on-error: true
        run: |
          export SUPABASE_URL=$(echo "$SB_API_URL" | tr -d '"')
          export SUPABASE_SERVICE_ROLE_KEY=$(echo "${SB_SERVICE_ROLE_KEY:-$SB_SECRET_KEY}" | tr -d '"')
          export SUPABASE_ANON_KEY=$(echo "${SB_ANON_KEY:-$SB_PUBLISHABLE_KEY}" | tr -d '"')
          REPORT_PATH=integration-report.json node scripts/integration-check.mjs 2>&1 | tail -40 > integration-log.txt; cat integration-log.txt
      - name: Screenshots
        continue-on-error: true
        run: |
          export SUPABASE_URL=$(echo "$SB_API_URL" | tr -d '"')
          export SUPABASE_ANON_KEY=$(echo "${SB_ANON_KEY:-$SB_PUBLISHABLE_KEY}" | tr -d '"')
          export SUPABASE_SERVICE_ROLE_KEY=$(echo "${SB_SERVICE_ROLE_KEY:-$SB_SECRET_KEY}" | tr -d '"')
          npx vite build >/dev/null; (npx vite preview --port 4173 >/dev/null 2>&1 &); sleep 3
          npm i --no-save playwright@1 >/dev/null 2>&1 && npx playwright install --with-deps chromium >/dev/null 2>&1
          node scripts/tmp/fixtures-and-shots.mjs
      - name: Publish results
        if: always()
        run: |
          mkdir -p /tmp/res && cp -r ci-log.txt integration-report.json integration-log.txt shots /tmp/res/ 2>/dev/null || true
          git config user.name "verify-bot"; git config user.email "verify-bot@users.noreply.github.com"
          git checkout --orphan results && git rm -rqf . && rm -rf ./* && cp -r /tmp/res/* . 
          git add -A && git commit -qm "results ${GITHUB_SHA}" && git push -f origin HEAD:claude/verify-results
